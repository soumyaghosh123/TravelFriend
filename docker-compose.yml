# Local infrastructure for TripSaver: PostgreSQL + Redis.
# Start: docker compose up -d    Stop: docker compose down    Wipe data: docker compose down -v
services:
  postgres:
    image: postgres:16-alpine
    container_name: tripsaver-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tripsaver}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tripsaver}
      POSTGRES_DB: ${POSTGRES_DB:-tripsaver}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tripsaver-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
